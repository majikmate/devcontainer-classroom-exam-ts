# Weekly updates of the GitHub actions and the base image.
# Deno is not updated here: the release workflow checks the newest Deno LTS
# release every night.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
